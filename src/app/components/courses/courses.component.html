<!-- Дописать условие для app-not-found!!! -->

<div class="flex flex-column align-items-flex-start gap-4">
  <app-not-found *ngIf="courses"></app-not-found>
  <app-course-item
    *ngFor="
      let course of filteredCourses.length
        ? filteredCourses
        : (courses | orderBy : 'creationDate')
    "
    [course]="course"
    (delete)="deleteCourse($event)"
    (edit)="editCourse($event)"
  ></app-course-item>
</div>
