<!-- eslint-disable @angular-eslint/template/elements-content -->
<div
  class="flex flex-row justify-content-center align-items-center py-3 w-full px-6 fixed top-50 custom__login z-4"
>
  <form
    #authForm="ngForm"
    class="flex flex-column align-items-flex-start w-23rem p-4 border-round-lg bg-white"
    (ngSubmit)="onSubmit(authForm)"
    novalidate
  >
    <h2 class="text-2xl font-medium pb-4">Вход</h2>
    <div class="flex flex-column mb-4">
      <label for="email" class="mb-2">Email*</label>
      <input
        pInputText
        id="email"
        name="email"
        pattern="^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$"
        minlength="3"
        aria-describedby="email-help"
        placeholder="Например user@domain.com"
        class="p-2 p-inputtext mb-1"
        ngModel
        required
        #email="ngModel"
      />
      <div
        class="text-red-500"
        *ngIf="email.invalid && (email.dirty || email.touched)"
      >
        <span *ngIf="email.errors?.['required']"
          >Поле обязательно для заполнения.</span
        >

        <!-- сообщение для minlength -->
        <span *ngIf="email.errors?.['minlength']">Минимум 3 символа.</span>

        <!-- сообщение для pattern, если нет minlength -->
        <span *ngIf="email.errors?.['pattern'] && !email.errors?.['minlength']">
          Введите корректный email
        </span>
      </div>
      <label for="password" class="mt-3 mb-2">Пароль*</label>
      <input
        pInputText
        id="password"
        name="password"
        minlength="5"
        aria-describedby="password-help"
        placeholder="Ваш пароль"
        class="p-2 p-inputtext"
        ngModel
        required
        #password="ngModel"
      />
      <div
        class="text-red-500"
        *ngIf="password.invalid && (password.dirty || password.touched)"
      >
        <span *ngIf="password.errors?.['minlength']">Минимум 5 символов.</span>
      </div>
    </div>
    <div class="flex flex-row justify-content-between align-items-center">
      <a href="#" class="underline font-normal text-sm text-primary"
        >Забыли пароль?</a
      >
      <button
        pButton
        label="Войти"
        [disabled]="authForm.invalid"
        class="p-button-primary"
        type="submit"
      ></button>
    </div>
  </form>
</div>
