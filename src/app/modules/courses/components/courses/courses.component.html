<div class="flex flex-column align-items-flex-start gap-4">
  <app-not-found *ngIf="isNotFound" (resetAll)="resetFilters()"></app-not-found>
  <app-course-item
    *ngFor="let course of courses ?? []"
    [course]="course"
    (edit)="editCourse($event)"
    (confirm)="showDeleteConfirm($event)"
  ></app-course-item>
  <p-confirmDialog rejectButtonStyleClass="p-button-outlined"></p-confirmDialog>
  <p-toast></p-toast>
</div>
