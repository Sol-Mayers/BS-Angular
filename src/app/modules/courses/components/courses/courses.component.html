<!-- Дописать условие для app-not-found!!! -->

<div class="flex flex-column align-items-flex-start gap-4">
  <app-not-found
    *ngIf="(courses ?? []).length === 0"
    (resetAll)="resetFilters()"
  ></app-not-found>
  <app-course-item
    *ngFor="let course of courses ?? [] | orderBy : 'creationDate'"
    [course]="course"
    (delete)="deleteCourse($event)"
    (edit)="editCourse($event)"
    (confirm)="showConfirm($event)"
  ></app-course-item>
  <p-confirmDialog rejectButtonStyleClass="p-button-outlined"></p-confirmDialog>
  <p-toast></p-toast>
</div>
