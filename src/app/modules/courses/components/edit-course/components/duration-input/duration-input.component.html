<label class="flex flex-column">
  Продолжительность*
  <input
    pInputText
    type="number"
    class="w-6"
    [value]="courseFields ? courseFields.duration : ''"
    (input)="courseFields.duration = getDuration($event)"
  />
  <div class="ml-2">
    {{ courseFields ? (courseFields.duration! | duration) : "" }}
  </div>
</label>
