<!-- eslint-disable @angular-eslint/template/elements-content -->
<div
  class="flex flex-column bg-white w-full p-3 border-round-lg font-normal justify-content-center align-items-flex-start"
>
  <h2 class="pb-3">Редактировать курс</h2>
  <form
    *ngIf="courseFields | async as course"
    class="flex flex-column pt-3 justify-content-center align-items-flex-start gap-5"
  >
    <label class="flex flex-column">
      Наименование*
      <input
        pInputText
        class="w-6"
        [value]="course?.title ?? ''"
        (input)="editedCourseFields.title = getName($event)"
      />
    </label>
    <label class="flex flex-column">
      Описание*
      <textarea
        pInputTextarea
        class="w-6"
        [value]="course?.description ?? ''"
        (input)="editedCourseFields.description = getDescription($event)"
      ></textarea>
    </label>
    <label class="flex flex-column">
      Продолжительность*
      <input
        pInputText
        type="number"
        class="w-6"
        [value]="course.duration ?? ''"
        (input)="editedCourseFields.duration = getDuration($event)"
      />
      <div class="ml-2">
        {{ (course.duration! | duration) ?? "" }}
      </div>
    </label>
    <label class="flex flex-column">
      Дата*
      <input
        pInputText
        type="date"
        class="w-6"
        [value]="
          course?.creationDate
            ? (course.creationDate | date : 'yyyy-MM-dd')
            : ''
        "
        (input)="editedCourseFields.creationDate = getDate($event)"
      />
    </label>
    <label class="flex flex-column">
      Авторы*
      <input pInputText class="w-6" [value]="getInputAuthors()" />
    </label>
    <div class="flex gap-2">
      <button
        pButton
        routerLink="/courses"
        routerLinkActive="active"
        label="Отмена"
        class="h-full no-underline text-primary custom_cancel-button"
        (click)="cancelCreateNewCourse($event)"
      ></button>
      <button
        pButton
        routerLink="/courses"
        routerLinkActive="active"
        label="Сохранить"
        class="p-button-primary h-full no-underline"
        [disabled]="!createIsAble ? false : true"
        (click)="editCourse()"
      ></button>
    </div>
  </form>
</div>
